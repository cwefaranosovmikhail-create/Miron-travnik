<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алтайский травник деда Мирона</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f5f0;
      color: #2c2523;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #e8e2d8;
      padding: 36px 28px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #eef5ea;
      color: #2e6930;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 26px;
      line-height: 1.3;
      margin-bottom: 14px;
      color: #1f3d20;
    }
    p.desc {
      font-size: 16px;
      line-height: 1.5;
      color: #555;
      margin-bottom: 24px;
    }
    .price-box {
      background: #faf8f5;
      border: 1px dashed #c9bfb0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 28px;
    }
    .price {
      font-size: 32px;
      font-weight: 800;
      color: #2e6930;
    }
    .btn-pay {
      display: block;
      width: 100%;
      background: #2e6930;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      padding: 18px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 105, 48, 0.3);
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-pay:hover {
      background: #255627;
    }
    .btn-pay:active {
      transform: scale(0.98);
    }
    .footer-note {
      font-size: 13px;
      color: #888;
      margin-top: 18px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Электронная книга</div>
    <h1>Алтайский травник деда Мирона</h1>
    <p class="desc">
      Полное руководство по сибирским травам, чаге и таёжным рецептам. 
      Проверенные сборы, правила заваривания и секреты долголетия.
    </p>

    <div class="price-box">
      <div style="font-size: 14px; color: #777; margin-bottom: 4px;">Стоимость доступа</div>
      <div class="price">990 ₽</div>
    </div>

    <!-- Форма отправки в Robokassa -->
    <form action="https://auth.robokassa.ru/Merchant/Index.aspx" method="POST">
      <input type="hidden" name="MerchantLogin" value="MironTravnikAltai">
      <input type="hidden" name="OutSum" value="990.00">
      <input type="hidden" name="InvId" value="101">
      <input type="hidden" name="Description" value="Книга Алтайский травник деда Мирона">

      <button type="submit" class="btn-pay">
        Перейти к оплате 990 ₽
      </button>
    </form>

    <div class="footer-note">
      Оплата картой любого банка РФ или через СБП.<br>
      Безопасный платёжный шлюз Robokassa.
    </div>
  </div>

</body>
</html>
